<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bank Transfer System</title>
</head>
<body>
    <h1>Bank Transfer System</h1>

    
    <h3 th:if="${error}" th:text="${error}" style="color: red;"></h3>
    <h3 th:if="${success}" th:text="${success}" style="color: green;"></h3>

    <h2>Total Balance in Bank: Rs. <span th:text="${totalBalance}"></span></h2>

    <hr>

   
    <h2>Transfer Money</h2>
    <form th:action="@{/transfer}" th:object="${transferRequest}" method="post">
        <label>From Account:</label>
        <input type="text" th:field="*{fromAccount}" required> <br><br>
        
        <label>To Account:</label>
        <input type="text" th:field="*{toAccount}" required> <br><br>
        
        <label>Amount:</label>
        <input type="number" step="0.01" th:field="*{amount}" required> <br><br>
        
        <!-- Error එක simulate කරන checkbox එක (ගොඩක් වැදගත්) -->
        <input type="checkbox" th:field="*{simulateFailure}"> 
        <label style="color: red;">Simulate a system failure</label> <br><br>
        
        <button type="submit">Transfer</button>
    </form>

    <hr>
    
   
    <h2>Customers</h2>
    <table border="1">
        <tr>
            <th>Account Number</th>
            <th>Name</th>
            <th>Balance</th>
        </tr>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.accountNumber}"></td>
            <td th:text="${customer.fullName}"></td>
            <td th:text="${customer.balance}"></td>
        </tr>
    </table>
</body>
</html>
